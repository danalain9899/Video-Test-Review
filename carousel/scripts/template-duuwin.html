<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* 3 colours only: white / black / orange */
  :root{ --white:#FFFFFF; --black:#111111; --orange:#F26A1B;
         --cond:'Bebas Neue','Anton',Impact,sans-serif; --display:'Anton','Bebas Neue',Impact,sans-serif;
         --sans:'Inter',-apple-system,Segoe UI,Roboto,sans-serif; --pad:64px; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1350px}
  .stage{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:var(--sans);background:var(--white);color:var(--black)}
  .bg{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat}

  .labels{position:absolute;top:56px;left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;
          font-weight:600;font-size:22px;letter-spacing:.14em;text-transform:uppercase;z-index:5}

  .flow{position:absolute;left:var(--pad);right:var(--pad);top:130px;bottom:150px;display:flex;flex-direction:column;gap:22px;z-index:3}
  .headline{font-family:var(--cond);font-size:112px;line-height:.92;text-transform:uppercase;letter-spacing:.005em;color:var(--black)}
  .hw{font-family:var(--display);font-size:250px;line-height:.98;text-transform:uppercase;color:var(--orange);
        white-space:nowrap;display:inline-block;align-self:flex-start;margin-top:-6px}
  .stage.s-small .headline{font-size:84px}
  .stage.s-small .hw{font-size:190px}

  .chips{display:flex;gap:12px;flex-wrap:wrap}
  .chip{background:var(--black);color:var(--white);font-weight:700;font-size:23px;padding:12px 20px;letter-spacing:.06em;text-transform:uppercase}
  .chip.o{background:var(--orange)}

  /* bias rows */
  .rows{display:flex;flex-direction:column;gap:22px}
  .row{display:flex;gap:20px;background:var(--white);border:3px solid var(--black);padding:18px 22px;box-shadow:8px 8px 0 var(--black)}
  .num{flex:none;width:96px;height:96px;background:var(--orange);color:var(--white);font-family:var(--display);font-size:54px;
       display:flex;align-items:center;justify-content:center}
  .rname{font-family:var(--cond);font-size:54px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
  .rfact{font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);margin-top:4px}
  .rline{font-weight:600;font-size:34px;line-height:1.22;margin-top:8px}
  .rtip{font-weight:700;font-size:28px;line-height:1.25;margin-top:8px;color:var(--black)}
  .rtip b{background:var(--black);color:var(--white);padding:2px 8px;margin-right:8px;font-size:18px;letter-spacing:.1em}
  .stage.s-three .rline{font-size:28px;margin-top:5px}
  .stage.s-three .rtip{font-size:23px;margin-top:5px}
  .stage.s-three .num{width:76px;height:76px;font-size:44px}
  .stage.s-three .rname{font-size:44px}
  .stage.s-three .row{padding:14px 20px}
  .stage.s-three .rows{gap:14px}

  .ctabox{background:var(--black);color:var(--white);padding:26px 34px;font-family:var(--cond);font-size:84px;line-height:.98;text-transform:uppercase;
       box-shadow:8px 8px 0 var(--orange)}
  .ctabox em{font-style:normal;color:var(--orange)}

  .sub{font-weight:600;font-size:24px;line-height:1.3;max-width:640px}
  .stage.s-hero .sub{position:absolute;left:var(--pad);bottom:170px;max-width:250px;font-size:22px;z-index:4}
  .meta{position:absolute;right:var(--pad);bottom:170px;text-align:right;font-weight:600;font-size:22px;line-height:1.3;max-width:240px;z-index:4;display:none}
  .stage.s-hero .meta{display:block}
  .stage.s-cta .meta{display:none}

  .mascot{position:absolute;z-index:6;filter:drop-shadow(0 16px 10px rgba(0,0,0,.25))}
  .mascot.center{left:50%;transform:translateX(-50%);bottom:50px}
  .mascot.br{right:40px;bottom:50px}
  .mascot.bl{left:40px;bottom:50px}

  .brand{position:absolute;left:var(--pad);bottom:56px;font-weight:800;font-size:26px;letter-spacing:.2em;text-transform:uppercase;z-index:7;
         background:var(--white);padding:2px 8px}
  .brand span{color:var(--orange)}
  .handle{position:absolute;right:var(--pad);bottom:56px;font-weight:700;font-size:26px;z-index:7;background:var(--white);padding:2px 8px;display:none}
  .stage.s-hero .handle,.stage.s-cta .handle{display:block}
  [data-optional].empty{display:none}
</style>
</head>
<body>
  <div class="stage __STAGECLASS__">
    <div class="bg" id="bg"></div>
    <div class="labels"><span>Marketing</span><span>Psikologi</span><span>Strategi</span></div>
    <div class="flow">
      <div class="headline" data-optional>__HEADLINE__</div>
      <div class="hw" id="hero" data-optional>__HERO_WORD__</div>
      <div class="content" data-optional>__CONTENT__</div>
      <div class="sub" data-optional>__SUBTITLE__</div>
    </div>
    <div class="meta">Siri Think Clearly<br>__INDEX__ / __TOTAL__</div>
    __MASCOT__
    <div class="brand">__BRAND_LABEL__</div>
    <div class="handle">__HANDLE__</div>
  </div>
  <script>
    var BG="__BG__";
    if(BG) document.getElementById('bg').style.backgroundImage="url('"+BG+"')";
    document.querySelectorAll('[data-optional]').forEach(function(el){
      if(!el.textContent.trim() && !el.querySelector('img')) el.classList.add('empty');
    });
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function(){
      var h=document.getElementById('hero'); var max=952, fs=parseFloat(getComputedStyle(h).fontSize);
      while(h.scrollWidth>max && fs>60){ fs-=4; h.style.fontSize=fs+'px'; }
    });
  </script>
</body>
</html>
